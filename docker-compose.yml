name: big-data-assignment
services:
  hive:
    image: apache/hive:4.0.0
    profiles: [hive]
    container_name: bigdata-hive
    environment:
      SERVICE_NAME: hiveserver2
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./data:/data:ro
      - ./code:/project/code:ro

  kafka:
    image: apache/kafka:3.8.1
    profiles: [kafka]
    container_name: bigdata-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24

  flink-jobmanager:
    image: flink:1.19.1-scala_2.12-java17
    profiles: [flink]
    container_name: bigdata-flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    volumes:
      - ./flink/target:/opt/flink/usrlib:ro

  flink-taskmanager:
    image: flink:1.19.1-scala_2.12-java17
    profiles: [flink]
    container_name: bigdata-flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager\ntaskmanager.numberOfTaskSlots: 2"

  flink-builder:
    image: maven:3.9.9-eclipse-temurin-17
    profiles: [flink]
    working_dir: /workspace
    volumes:
      - ./flink:/workspace
      - maven-cache:/root/.m2
    entrypoint: ["mvn", "-B", "-ntp", "-DskipTests", "package"]

  mongo:
    image: mongo:7.0
    profiles: [mongo]
    container_name: bigdata-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  maven-cache:
